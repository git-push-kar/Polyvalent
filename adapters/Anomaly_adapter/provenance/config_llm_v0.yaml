# v0 LLM block extracted from C:\Users\Admin\Desktop\anomaly\configs\config.yaml (§llm)
# Gated 2026-10-15: adapter loads warning-free, JSON 100%, grounding 100%.
# prefer_llm:false = deterministic intents first, LLM for open-ended follow-ups.
llm:
  base_model: "./models/internvl3_2b_lr_fused"
  adapter_name: intern_fused_lr
  adapter_dir: outputs/intern_fused_lr_v0
  trust_remote_code: true
  use_flash_attn: false
  dummy_image_size: 448
  followup:
    prefer_llm: false
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    bias: none
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
  generation:
    max_new_tokens: 512
    do_sample: false
    temperature: 0.7
    top_p: 0.9
    top_k: 50
    repetition_penalty: 1.0
