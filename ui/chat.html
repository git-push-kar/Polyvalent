<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forensic Assistant</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100dvh; }
  header { text-align: center; padding: 14px 12px 8px; border-bottom: 1px solid #8883; }
  header h1 { font-size: 18px; margin: 0; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .65; }
  #log { flex: 1; overflow-y: auto; padding: 18px 12px; display: flex; flex-direction: column; gap: 12px; max-width: 820px; width: 100%; margin: 0 auto; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .assistant { align-self: flex-start; background: #8882; border-bottom-left-radius: 4px; }
  .assistant.thinking { opacity: .7; font-style: italic; }
  .cursor::after { content: "▍"; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #composer { border-top: 1px solid #8883; padding: 12px; display: flex; gap: 10px; max-width: 820px; width: 100%; margin: 0 auto 12px; }
  #box { flex: 1; resize: none; border: 1px solid #8886; border-radius: 12px; padding: 10px 14px; font-size: 15px; font-family: inherit; max-height: 140px; }
  #send { background: #2563eb; color: #fff; border: none; border-radius: 12px; padding: 0 22px; font-size: 15px; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: wait; }
  #hint { text-align: center; font-size: 12px; opacity: .55; padding-bottom: 10px; }
</style>
</head>
<body>
<header>
  <h1>Forensic Assistant</h1>
  <p>Ask about face-image forensics or sensor anomalies</p>
  <p id="modebanner" style="display:none;font-size:12px;background:#fef3c7;color:#92400e;border-radius:8px;padding:4px 12px;">Demo mode — showing placeholder text. Unset FINAL_STUB_GENERATION for live model answers.</p>
</header>

<div id="log" aria-live="polite"></div>

<div>
  <div id="composer">
    <label for="img" title="Attach an image" style="align-self:center;cursor:pointer;font-size:20px;">📎</label>
    <input type="file" id="img" accept="image/*" hidden>
    <textarea id="box" rows="1" placeholder="Type your question…  (Enter to send, Shift+Enter for new line)"></textarea>
    <button id="send">Send</button>
  </div>
  <div id="imgchip" style="display:none;text-align:center;font-size:13px;">🖼 image attached <a href="#" id="imgclear">remove</a></div>
  <div id="hint">Answers stream in as they are generated. <a href="/ui/">Research console</a></div>
</div>

<script>
const log = document.getElementById('log');
const box = document.getElementById('box');
const send = document.getElementById('send');
const imgInput = document.getElementById('img');
const imgchip = document.getElementById('imgchip');
const history = [];  // {role, content} — sent back for context, never shown as internals
let attachedB64 = null;

imgInput.onchange = () => {
  const f = imgInput.files && imgInput.files[0];
  if (!f) { attachedB64 = null; imgchip.style.display = 'none'; return; }
  const r = new FileReader();
  r.onload = () => { attachedB64 = String(r.result).split(',')[1]; imgchip.style.display = 'block'; };
  r.readAsDataURL(f);
};
document.getElementById('imgclear').onclick = e => {
  e.preventDefault();
  attachedB64 = null; imgInput.value = ''; imgchip.style.display = 'none';
};

function bubble(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

async function ask() {
  const message = box.value.trim();
  if (!message || send.disabled) return;
  box.value = '';
  send.disabled = true;
  bubble('user', message + (attachedB64 ? '\n[image attached]' : ''));
  const pending = bubble('assistant thinking', 'Analyzing…');

  try {
    const body = { message, history: history.slice(-6), max_new_tokens: 256 };
    if (attachedB64) body.image_base64 = attachedB64;
    const resp = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    attachedB64 = null; imgInput.value = ''; imgchip.style.display = 'none';
    if (!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status);
    pending.textContent = '';
    pending.classList.remove('thinking');
    pending.classList.add('cursor');
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '', gotText = false;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const p of parts) {
        const line = p.trim().split('\n').find(l => l.startsWith('data:'));
        if (!line) continue;
        const ev = JSON.parse(line.slice(5));
        if (ev.event === 'token') {
          pending.textContent += ev.text;
          gotText = true;
        } else if (ev.event === 'notice') {
          pending.textContent = ev.text;
          gotText = true;
        }
        log.scrollTop = log.scrollHeight;
      }
    }
    if (!gotText) pending.textContent = 'Sorry — something went wrong. Please try again.';
    history.push({ role: 'user', content: message });
    history.push({ role: 'assistant', content: pending.textContent });
  } catch (err) {
    pending.textContent = 'Connection error — is the server running?';
  } finally {
    pending.classList.remove('cursor');
    send.disabled = false;
box.focus();
fetch('/health').then(r => r.json()).then(h => {
  if (String(h.stub_generation) === '1') document.getElementById('modebanner').style.display = 'inline-block';
}).catch(() => {});

  }
}

send.onclick = ask;
box.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
});
box.focus();
</script>
</body>
</html>
